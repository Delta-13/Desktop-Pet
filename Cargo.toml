[package]
name = "terminal-sprite-pet"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Run Codex-compatible animated sprite pets in image-capable terminals."
keywords = ["terminal", "sprite", "pet", "kitty", "sixel"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
