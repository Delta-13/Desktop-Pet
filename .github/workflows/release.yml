name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          $archive = "Desktop-Pet-$env:GITHUB_REF_NAME-windows-x86_64.zip"
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/terminal-sprite-pet.exe dist/package/
          Copy-Item README.md, LICENSE, NOTICE dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/$archive"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.asset_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset_arch: x86_64
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Build app bundle
        env:
          ASSET_ARCH: ${{ matrix.asset_arch }}
          TARGET: ${{ matrix.target }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          app="dist/Desktop Pet.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/$TARGET/release/terminal-sprite-pet" "$app/Contents/MacOS/"
          chmod +x "$app/Contents/MacOS/terminal-sprite-pet"
          cp README.md LICENSE NOTICE "$app/Contents/Resources/"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key><string>Desktop Pet</string>
            <key>CFBundleExecutable</key><string>terminal-sprite-pet</string>
            <key>CFBundleIdentifier</key><string>com.delta13.desktop-pet</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>Desktop Pet</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          codesign --force --deep --sign - "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "dist/Desktop-Pet-$GITHUB_REF_NAME-macos-$ASSET_ARCH.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.asset_arch }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.zip
          --verify-tag
          --generate-notes
          --title "Desktop Pet $GITHUB_REF_NAME"
